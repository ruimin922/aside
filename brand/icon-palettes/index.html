<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旁白 · 图标配色</title><style>*{box-sizing:border-box}body{margin:0;background:#211e29;color:#f2edf7;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:44px;line-height:1.6}main{max-width:1050px;margin:auto}h1{font-size:28px;margin:8px 0}p{color:#b9b0c5;margin:8px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{border:1px solid #ffffff20;border-radius:20px;overflow:hidden}h2{font-size:18px;margin:0}header{padding:20px}header p{font-size:13px;margin:4px 0 0}.samples{display:grid;grid-template-columns:1fr 1fr}.sample{display:grid;place-items:center;gap:24px;padding:28px 8px;background:#34303c}.sample.light{background:#ece9f0;color:#686171}.icon{width:104px;height:104px;overflow:hidden;display:block}.icon img{width:128%;max-width:none;margin:-14%}.mini{width:24px;height:24px}.label{font-size:12px;opacity:.7}.footer{margin-top:24px;font-size:13px}@media(max-width:720px){body{padding:24px}.grid{grid-template-columns:1fr}}</style><main><div class="label">旁白 ASIDE / 配色候选</div><h1>同一个电影图案，三种颜色</h1><p>保留手绘轮廓与透明外沿。每组同时查看深浅底色与工具栏尺寸。</p><div class="grid"><article><header><h2>01 · 灰紫 / 浅底</h2><p>保留灰紫外框，内底调整为浅乳白紫</p></header><div class="samples"><div class="sample "><span class="icon"><img src="lavender-light-fill.png" alt="01 · 灰紫 / 浅底"></span><span class="icon mini"><img src="lavender-light-fill.png" alt="工具栏尺寸"></span><span class="label">深色背景</span></div><div class="sample light"><span class="icon"><img src="lavender-light-fill.png" alt="01 · 灰紫 / 浅底"></span><span class="icon mini"><img src="lavender-light-fill.png" alt="工具栏尺寸"></span><span class="label">浅色背景</span></div></div></article><article><header><h2>02 · 石墨灰</h2><p>中性、清晰，适合深浅工具栏</p></header><div class="samples"><div class="sample "><span class="icon"><img src="graphite.png" alt="02 · 石墨灰"></span><span class="icon mini"><img src="graphite.png"
