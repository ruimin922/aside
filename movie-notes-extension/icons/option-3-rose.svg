<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 烟玫瑰 · 镜头光圈 + 笔 -->
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9707A"/>
      <stop offset="100%" stop-color="#A0505A"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg3)"/>

  <!-- 圆形镜头外圈 -->
  <circle cx="58" cy="60" r="34" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
  <!-- 内圈 -->
  <circle cx="58" cy="60" r="22" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  <!-- 最内圈 -->
  <circle cx="58" cy="60" r="10" fill="#ffffff" opacity="0.2"/>

  <!-- 光圈叶片（简化4片） -->
  <line x1="58" y1="26" x2="58" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="58" y1="84" x2="58" y2="94" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="24" y1="60" x2="34" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="82" y1="60" x2="92" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- 右下角铅笔 -->
  <g transform="translate(92, 94) rotate(-45)">
    <rect x="-4" y="-18" width="8" height="22" rx="2" fill="#ffffff" opacity="0.9"/>
    <polygon points="-4,4 4,4 0,12" fill="#FFD4D8" opacity="0.95"/>
    <rect x="-4" y="-23" width="8" height="6" rx="1.5" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>
