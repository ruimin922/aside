name: Check and package extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Check release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("movie-notes-extension/manifest.json")).version; if(process.env.RELEASE_TAG !== `v${v}`) process.exit(1);'
      - uses: actions/upload-artifact@v4
        with:
          name: aside-extension
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aside-extension
          path: dist
      - name: Publish versioned ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/RELEASE-${RELEASE_TAG#v}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "旁白 Aside $RELEASE_TAG" --notes-file "$notes"
