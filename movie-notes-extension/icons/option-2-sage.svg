<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 莫兰迪绿 · 极简拍板 -->
  <rect width="128" height="128" rx="24" fill="#4A7C67"/>

  <!-- 拍板主体 -->
  <rect x="24" y="50" width="80" height="52" rx="6" fill="#ffffff" opacity="0.12"/>
  <rect x="24" y="50" width="80" height="52" rx="6" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>

  <!-- 拍板顶条 -->
  <rect x="24" y="36" width="80" height="16" rx="6" fill="#ffffff" opacity="0.2"/>

  <!-- 拍板斜纹 -->
  <clipPath id="clip-top">
    <rect x="24" y="36" width="80" height="16" rx="6"/>
  </clipPath>
  <g clip-path="url(#clip-top)">
    <line x1="24" y1="52" x2="44" y2="36" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
    <line x1="44" y1="52" x2="64" y2="36" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
    <line x1="64" y1="52" x2="84" y2="36" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
    <line x1="84" y1="52" x2="104" y2="36" stroke="#ffffff" stroke-width="6" opacity="0.25"/>
  </g>

  <!-- 笔记线 -->
  <rect x="36" y="66" width="56" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
  <rect x="36" y="76" width="42" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
  <rect x="36" y="86" width="28" height="3" rx="1.5" fill="#ffffff" opacity="0.25"/>
</svg>
