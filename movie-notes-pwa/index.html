<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#302a3b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="观影笔记" />
  <title>观影笔记</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=film-4" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>

  <!-- ── 下拉刷新指示器 ── -->
  <div class="ptr-indicator" id="ptrIndicator" aria-hidden="true">
    <div class="ptr-indicator__spinner"></div>
  </div>

  <!-- ── 离线横幅 ── -->
  <div class="offline-banner" id="offlineBanner" hidden role="status" aria-live="polite">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a11 11 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <path d="M12 20h.01"/>
    </svg>
    <span>离线中 · 显示本地缓存</span>
  </div>

  <!-- ── 电影列表页（默认首页） ── -->
  <div data-view="list" hidden>
    <header class="topbar">
      <span class="topbar__title">观影笔记</span>
      <div class="topbar__right">
        <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="search" placeholder="搜索电影标题…" autocomplete="off" />
    </div>

    <div class="sort-chips" id="sortChips" role="tablist" aria-label="排序">
      <button type="button" class="sort-chip is-active" data-sort="updated" role="tab" aria-selected="true">最近更新</button>
      <button type="button" class="sort-chip" data-sort="created" role="tab" aria-selected="false">创建时间</button>
      <button type="button" class="sort-chip" data-sort="notes" role="tab" aria-selected="false">笔记最多</button>
    </div>

    <div class="tag-chips" id="tagChips" hidden aria-label="标签筛选"></div>

    <div class="list-stats" id="listStats"></div>

    <div class="movie-list" id="movieList">
      <div class="skeleton-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </div>

  <!-- ── 电影详情页 ── -->
  <div data-view="detail" hidden>
    <header class="topbar topbar--detail">
      <button class="icon-btn" id="btnBack" title="返回" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="topbar__title topbar__title--shrink" id="detailTitle"></span>
      <div class="topbar__right">
        <button class="icon-btn" id="btnDetailVideo" title="打开视频" aria-label="打开视频" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M7 17 17 7"/>
            <path d="M9 7h8v8"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnDetailShare" title="分享" aria-label="分享">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M12 3v13"/>
            <path d="m7 8 5-5 5 5"/>
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-stats" id="detailStatsWrap" hidden>
      <span class="detail-stats__count" id="detailStats"></span>
      <input class="search-input search-input--inline" id="entrySearch" type="search" placeholder="搜索条目内容…" autocomplete="off" />
    </div>
    <div class="entry-list" id="entryList">
      <div class="skeleton-list">
        <div class="skeleton-entry"></div>
        <div class="skeleton-entry"></div>
      </div>
    </div>
  </div>

  <!-- ── 设置页 ── -->
  <div data-view="settings" hidden>
    <header class="topbar topbar--detail">
      <button class="icon-btn" id="btnSettingsBack" title="返回" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <span class="topbar__title topbar__title--shrink">设置</span>
      <div style="width:36px"></div>
    </header>

    <div class="settings-body">
      <!-- 账号 -->
      <section class="settings-section">
        <div class="settings-section__label">账号</div>
        <div class="settings-group">
          <div class="settings-row">
            <span class="settings-row__name">云端同步</span>
            <div class="account-card__status">
              <span class="sync-dot" id="syncDot" data-state="hidden" title="同步状态"></span>
              <span class="account-card__status-text" id="accountStatusText"></span>
            </div>
          </div>

          <!-- 未登录 -->
          <div class="settings-row settings-row--block" id="accountGuest">
            <p class="account-card__hint">登录后笔记自动多端同步，在浏览器扩展与手机之间保持一致。</p>
            <button type="button" class="btn-google-login" id="btnSignIn">
              <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.6 2.4 30.1 0 24 0 14.8 0 7 5.5 3.1 13.5l7.8 6C12.7 13.8 17.9 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
                <path fill="#FBBC05" d="M10.9 28.5A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.5l-7.8-6A24 24 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l8.4-6.1z"/>
                <path fill="#34A853" d="M24 48c6.1 0 11.2-2 14.9-5.4l-7.5-5.8c-2 1.4-4.6 2.2-7.4 2.2-6.1 0-11.3-4.1-13.1-9.7l-8.4 6.1C7 43.2 14.8 48 24 48z"/>
              </svg>
              <span id="btnSignInLabel">使用 Google 账号登录</span>
            </button>
          </div>

          <!-- 已登录 -->
          <div class="settings-row settings-row--block" id="accountUser" hidden>
            <div class="account-card__user-row">
              <img class="account-card__avatar" id="accountAvatar" alt="" src="" width="40" height="40" hidden />
              <div class="account-card__user-info">
                <span class="account-card__email" id="accountEmail"></span>
                <button type="button" class="text-link text-link--muted" id="btnSignOut">退出登录</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 关于 -->
      <section class="settings-section">
        <div class="settings-section__label">关于</div>
        <div class="settings-group">
          <div class="settings-row settings-row--block">
            <div class="settings-row__value settings-row__value--multiline">
              这是「观影笔记」的查看端。记录请使用 Chrome 扩展，登录后本端会自动同步显示。
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ── 全局 toast ── -->
  <div class="toast" id="toast" hidden></div>

  <!-- ── 全屏 loading（登录中） ── -->
  <div class="loading-overlay" id="loadingOverlay" hidden>
    <div class="loading-overlay__spinner"></div>
    <div class="loading-overlay__text" id="loadingOverlayText">登录中…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
